name: Deploy to GitHub Pages

# Pages actions currently retain their published major tags while GitHub moves
# the hosted runtime from Node 20 to Node 24. Make that runtime explicit so
# future hosted runs do not rely on the compatibility fallback or warn for it.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
        env:
          VITE_NEON_AUTH_URL: https://ep-restless-glade-asjqlwz6.neonauth.c-4.eu-central-1.aws.neon.tech/neondb/auth
          VITE_NEON_DATA_API_URL: https://ep-restless-glade-asjqlwz6.apirest.c-4.eu-central-1.aws.neon.tech/neondb/rest/v1
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
